<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='footer.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>
    <footer class="stockometer-footer-root-container-unique">

  <div class="stockometer-footer-top-layout-wrapper-unique">
    
    <div class="stockometer-footer-logo-circle-container-unique">
      <img src="{{ url_for('static', filename='src/logo1-cropped.png') }}" alt="Stockometer Logo">
    </div>

    <div class="stockometer-footer-divider-line-unique"></div>

    <div class="stockometer-footer-creator-block-unique">
      <div class="stockometer-footer-madeby-text-unique">MADE BY</div>
      <div class="stockometer-footer-creator-name-unique" data-text="ALV!N">ALV!N</div>
    </div>

  </div>

  <div class="stockometer-footer-bottom-branding-wrapper-unique">
    <h1 id="stockometer-brand-h1">STOCKOMETER</h1>
  </div>

  <div class="stockometer-footer-copyright-unique">
    &copy; 2026 Stockometer. All rights reserved.
  </div>

</footer>
<script>
(function () {
    function fitBrandText() {
        var h1 = document.getElementById('stockometer-brand-h1');
        if (!h1) return;

        var wrapper = h1.parentElement;

        // Reset for measurement
        h1.style.fontSize = '100px';

        // Measure
        var availableWidth = wrapper.clientWidth; // clientWidth excludes padding
        var textWidth = h1.scrollWidth;

        // Calculate scale - Use 1.0 for absolute edges
        // If there is still a tiny gap, use 1.01 to slightly 'over-scale' 
        var scale = (availableWidth / textWidth) * 1.0;

        h1.style.fontSize = (100 * scale) + 'px';
    }

    window.addEventListener('load', () => setTimeout(fitBrandText, 50));
    window.addEventListener('resize', fitBrandText);
})();
</script>
</body>
</html>
