<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stockometer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/src/logo1-cropped.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/index.css">
</head>
<body>

    <div class="wrapper">
        <h1 class="title">STOCKOMETER</h1>
        <p class="subtitle">Analyze historical performance in seconds</p>

        <form method="POST" action="/analyze" class="form">

            <div class="symbol-input autocomplete">
                <input 
                    id="symbol-input"
                    type="text" 
                    name="symbol" 
                    value="{{ symbol_value or '' }}"
                    placeholder="Enter stock symbol (e.g. AAPL, TSLA, INFY.NS)"
                    autocomplete="off"
                    autocapitalize="characters"
                    aria-autocomplete="list"
                    aria-controls="symbol-suggestions"
                    aria-expanded="false"
                    aria-haspopup="listbox"
                    role="combobox"
                    required
                >
                <div
                    id="symbol-suggestions"
                    class="suggestions"
                    role="listbox"
                    hidden
                ></div>
            </div>

            {% if error_message %}
            <p class="form-error" id="form-error" role="alert">{{ error_message }}</p>
            {% endif %}

            <button type="submit">Analyze</button>

        </form>
    </div>

    <script src="/static/index.js"></script>
</body>

</html>
